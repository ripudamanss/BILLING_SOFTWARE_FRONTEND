<!DOCTYPE html>
<html>

<head>
    <title>Admin Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            color-scheme: light;
            --bg: #f4f7fb;
            --surface: #ffffff;
            --surface-strong: #f8fbff;
            --border: #d9e2ec;
            --text: #102a43;
            --muted: #627d98;
            --primary: #2563eb;
            --primary-strong: #1d4ed8;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(180deg, #1966cd 0%, rgb(81, 147, 214) 100%);
            font-family: Inter, Arial, sans-serif;
            color: var(--text);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            width: min(1200px, calc(100% - 36px));
            margin: 0 auto;
            padding: 32px 0 44px;
        }

        .page-header {
            margin-bottom: 24px;
            padding: 28px 28px 32px;
            background: #eff6ff;
            border: 1px solid rgba(37, 99, 235, 0.15);
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.06);
        }

        .page-header h1 {
            margin: 0;
            font-size: clamp(2rem, 2.4vw, 2.8rem);
            letter-spacing: -0.03em;
            line-height: 1.05;
        }

        .page-header p {
            margin: 0;
            color: var(--muted);
            max-width: 760px;
            font-size: 1rem;
        }

        .box {
            background: var(--surface);
            padding: 32px;
            margin-bottom: 24px;
            border-radius: 28px;
            border: 1px solid rgba(148, 163, 184, 0.18);
            box-shadow: 0 18px 45px rgba(15, 23, 42, 0.05);
        }

        .box h2 {
            margin-top: 0;
            margin-bottom: 18px;
            font-size: 1.55rem;
        }

        .box h3 {
            margin: 0 0 16px;
            font-size: 1rem;
            color: var(--muted);
            font-weight: 500;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            align-items: stretch;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label span {
            font-size: 1rem;
            color: var(--muted);
        }

        input,
        select,
        textarea {
            width: 100%;
            min-height: 50px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--surface-strong);
            padding: 14px 16px;
            color: var(--text);
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
            font-size: 1rem;
        }

        textarea {
            min-height: 140px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: rgba(37, 99, 235, 0.65);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.14);
            background: #ffffff;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: center;
            justify-content: flex-end;
            margin-top: 24px;
        }

        .switch-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 24px;
            margin-top: 20px;
            color: var(--muted);
        }

        .switch-row label {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
        }

        .switch-row input {
            width: auto;
            height: auto;
            margin: 0;
        }

        button {
            border: none;
            border-radius: 999px;
            cursor: pointer;
            padding: 14px 24px;
            font-weight: 600;
            font-size: 0.98rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease, opacity 0.2s ease;
        }

        .btn {
            background: var(--primary);
            color: white;
            box-shadow: 0 12px 28px rgba(37, 99, 235, 0.18);
        }

        .btn:hover {
            background: var(--primary-strong);
            transform: translateY(-1px);
        }

        .btn.secondary {
            background: #f8fafc;
            color: var(--text);
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
        }

        .btn.secondary:hover {
            background: #e2e8f0;
        }

        .btn.danger {
            background: var(--danger);
            color: white;
            box-shadow: 0 12px 28px rgba(239, 68, 68, 0.18);
        }

        .btn.danger:hover {
            background: #dc2626;
        }

        .table-wrap {
            overflow-x: auto;
            margin-top: 16px;
            border-radius: 20px;
            background: #f8fbff;
            padding: 6px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            overflow: hidden;
            border-radius: 18px;
            box-shadow: 0 14px 34px rgba(15, 23, 42, 0.06);
            background: white;
        }

        th,
        td {
            padding: 18px 20px;
            text-align: left;
        }

        th {
            background: #334155;
            color: #f8fafc;
            font-weight: 700;
            letter-spacing: 0.02em;
            font-size: 0.95rem;
        }

        td {
            border-top: 1px solid #e2e8f0;
            color: #334155;
            font-size: 0.96rem;
        }

        tr:nth-child(even) td {
            background: #f8fbff;
        }

        tr:hover td {
            background: #e8f1ff;
        }

        .table-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: flex-start;
        }

        .table-actions button {
            min-width: 92px;
            padding: 10px 14px;
            font-size: 0.92rem;
        }

        hr {
            border: none;
            border-top: 1px solid #e2e8f0;
            margin: 28px 0;
        }

        @media (max-width: 720px) {

            .page-header,
            .box {
                padding: 22px;
            }

            .controls,
            .switch-row {
                flex-direction: column;
                align-items: stretch;
            }

            .container {
                padding: 22px 0 30px;
            }
        }

        @keyframes spin {

            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>

<body>
    <div class="container">
        <div class="page-header">
            <h1>Admin Portal</h1>
            <p>Manage company settings, users and items from one centralized dashboard with a polished experience.</p>
            <button class="btn secondary" onclick="window.location.href='dashboard.html'">Go to Dashboard</button>
        </div>

        <div class="box">
            <h2>Company Settings</h2>

            <div class="form-grid">
                <div class="form-field">
                    <label><span>Company Name</span>
                        <input id="company_name" placeholder="Company Name">
                    </label>
                </div>
                <div class="form-field">
                    <label><span>Phone</span>
                        <input id="phone" placeholder="Phone">
                    </label>
                </div>
                <div class="form-field">
                    <label><span>Address Line 1</span>
                        <input id="address1" placeholder="Address Line 1">
                    </label>
                </div>
                <div class="form-field">
                    <label><span>Address Line 2</span>
                        <input id="address2" placeholder="Address Line 2">
                    </label>
                </div>
            </div>

            <hr>

            <h3>Bank Details</h3>

            <div class="form-grid">
                <div class="form-field">
                    <label><span>Bank Name</span>
                        <input id="bank_name" placeholder="Bank Name">
                    </label>
                </div>
                <div class="form-field">
                    <label><span>Account Holder</span>
                        <input id="account_holder" placeholder="Account Holder">
                    </label>
                </div>
                <div class="form-field">
                    <label><span>Account Number</span>
                        <input id="account_number" placeholder="Account Number">
                    </label>
                </div>
                <div class="form-field">
                    <label><span>IFSC</span>
                        <input id="ifsc" placeholder="IFSC">
                    </label>
                </div>
            </div>

            <hr>

            <div class="form-field">
                <label><span>Footer Note</span>
                    <textarea id="footer_note" placeholder="Footer Note"></textarea>
                </label>
            </div>

            <div class="switch-row">
                <label>
                    <input type="checkbox" id="show_bank_details">
                    Show Bank Details
                </label>
                <label>
                    <input type="checkbox" id="show_footer_note">
                    Show Footer Note
                </label>
            </div>

            <div class="controls">
                <button class="btn" onclick="saveSettings()">Save Settings</button>
            </div>
        </div>

        <div class="box">
            <h2>Create User</h2>

            <div class="form-grid">
                <div class="form-field">
                    <label><span>Username</span>
                        <input id="username" placeholder="Username">
                    </label>
                </div>
                <div class="form-field">
                    <label><span>Password</span>
                        <input type="password" id="password" placeholder="Password">
                    </label>
                </div>
                <div class="form-field">
                    <label><span>Role</span>
                        <select id="role">
                            <option value="staff">Staff</option>
                            <option value="admin">Admin</option>
                        </select>
                    </label>
                </div>
            </div>

            <div class="controls">
                <button class="btn" onclick="createUser()">Create User</button>
            </div>
        </div>

        <div class="box">
            <h2>Users</h2>
            <div class="table-wrap">
                <table id="usersTable">
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </table>
            </div>
        </div>

        <div class="box">
            <h2>Create Item</h2>
            <div class="form-grid">
                <div class="form-field">
                    <label><span>Description</span>
                        <input id="itemDescription" placeholder="Description">
                    </label>
                </div>
                <div class="form-field">
                    <label><span>Unit</span>
                        <input id="itemUnit" placeholder="Unit">
                    </label>
                </div>
                <div class="form-field">
                    <label><span>Price</span>
                        <input id="itemPrice" placeholder="Price">
                    </label>
                </div>
            </div>

            <div class="controls">
                <button class="btn" onclick="createItem()">Create Item</button>
            </div>
        </div>

        <div class="box">
            <h2>Items</h2>
            <div class="table-wrap">
                <table id="itemsTable">
                    <tr>
                        <th>ID</th>
                        <th>Description</th>
                        <th>Unit</th>
                        <th>Price</th>
                        <th>Actions</th>
                    </tr>
                </table>
            </div>
        </div>

        <div id="pageLoader" style="
            position:fixed;
            inset:0;
            background:rgba(255,255,255,0.95);
            z-index:99999;
            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;
            font-family:Arial;
        ">

            <div style="
            width:60px;
            height:60px;
            border:6px solid #ddd;
            border-top:6px solid #4CAF50;
            border-radius:50%;
            animation:spin 1s linear infinite;
            margin-bottom:20px;
        "></div>

            <h2>Loading Admin Panel...</h2>

        </div>
        <script>

            const role = localStorage.getItem("role");

            if (role !== "admin") {
                alert("Access denied");
                window.location.href = "dashboard.html";
            }
            const BASE_URL = "https://billing-software-backend-04do.onrender.com";
            // const BASE_URL = "https://supreme-space-spoon-qx9wr7g66ppfxvg7-10000.app.github.dev";

            async function authFetch(
                url,
                options = {}
            ) {

                const token =
                    localStorage.getItem("token");

                options.headers = {
                    ...(options.headers || {}),
                    "Authorization":
                        "Bearer " + token,
                    "Content-Type":
                        "application/json"
                };

                const res =
                    await fetch(url, options);

                if (res.status === 401) {

                    alert("Session expired");

                    localStorage.clear();

                    window.location.href =
                        "login.html";
                }

                return res;
            }

            async function loadUsers() {

                const res =
                    await authFetch(
                        `${BASE_URL}/users`
                    );

                const users =
                    await res.json();

                const table =
                    document.getElementById(
                        "usersTable"
                    );

                table.innerHTML = `
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Role</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
            `;

                users.forEach(user => {

                    table.innerHTML += `
            <tr>
                <td>${user.id}</td>
                <td>${user.username}</td>
                <td>${user.role}</td>
                <td>
                    ${user.is_active ? "Active" : "Disabled"}
                </td>
                <td>
                    <button onclick="toggleUser(${user.id})">
                        Toggle
                    </button>

                    <button onclick="deleteUser(${user.id})">
                        Delete
                    </button>
                </td>
            </tr>
            `;
                });
            }

            async function createUser() {

                const username =
                    document.getElementById(
                        "username"
                    ).value;

                const password =
                    document.getElementById(
                        "password"
                    ).value;

                const role =
                    document.getElementById(
                        "role"
                    ).value;

                await authFetch(
                    `${BASE_URL}/users`,
                    {
                        method: "POST",

                        body: JSON.stringify({
                            username,
                            password,
                            role
                        })
                    }
                );

                loadUsers();
            }

            async function toggleUser(id) {

                await authFetch(
                    `${BASE_URL}/users/${id}/toggle`,
                    {
                        method: "PUT"
                    }
                );

                loadUsers();
            }

            async function deleteUser(id) {

                await authFetch(
                    `${BASE_URL}/users/${id}`,
                    {
                        method: "DELETE"
                    }
                );

                loadUsers();
            }

            async function loadItems() {

                const res =
                    await authFetch(
                        `${BASE_URL}/admin/items`
                    );

                const items =
                    await res.json();

                items.sort((a, b) => a.id - b.id);

                const table =
                    document.getElementById(
                        "itemsTable"
                    );

                table.innerHTML = `
        <tr>
            <th>ID</th>
            <th>Description</th>
            <th>Unit</th>
            <th>Price</th>
            <th>Actions</th>
        </tr>
            `;

                items.forEach(item => {

                    table.innerHTML += `
            <tr>
                <td>${item.id}</td>
                <td>${item.description}</td>
                <td>${item.unit}</td>
                <td>${item.price}</td>
                <td>
                    <button onclick="deleteItem(${item.id})">
                        Delete
                    </button>
                </td>
            </tr>
            `;
                });
            }

            async function createItem() {

                const description =
                    document.getElementById(
                        "itemDescription"
                    ).value;

                const unit =
                    document.getElementById(
                        "itemUnit"
                    ).value;

                const price =
                    parseFloat(
                        document.getElementById(
                            "itemPrice"
                        ).value
                    );

                await authFetch(
                    `${BASE_URL}/admin/items`,
                    {
                        method: "POST",

                        body: JSON.stringify({
                            description,
                            unit,
                            price
                        })
                    }
                );

                loadItems();
            }

            async function loadSettings() {

                const res =
                    await authFetch(
                        `${BASE_URL}/admin/settings`
                    );

                const data =
                    await res.json();

                document.getElementById(
                    "company_name"
                ).value =
                    data.company_name || "";

                document.getElementById(
                    "address1"
                ).value =
                    data.address1 || "";

                document.getElementById(
                    "address2"
                ).value =
                    data.address2 || "";

                document.getElementById(
                    "phone"
                ).value =
                    data.phone || "";

                document.getElementById(
                    "bank_name"
                ).value =
                    data.bank_name || "";

                document.getElementById(
                    "account_holder"
                ).value =
                    data.account_holder || "";

                document.getElementById(
                    "account_number"
                ).value =
                    data.account_number || "";

                document.getElementById(
                    "ifsc"
                ).value =
                    data.ifsc || "";

                document.getElementById(
                    "footer_note"
                ).value =
                    data.footer_note || "";

                document.getElementById(
                    "show_bank_details"
                ).checked =
                    data.show_bank_details;

                document.getElementById(
                    "show_footer_note"
                ).checked =
                    data.show_footer_note;
            }


            async function saveSettings() {

                const payload = {

                    company_name:
                        document.getElementById(
                            "company_name"
                        ).value,

                    address1:
                        document.getElementById(
                            "address1"
                        ).value,

                    address2:
                        document.getElementById(
                            "address2"
                        ).value,

                    phone:
                        document.getElementById(
                            "phone"
                        ).value,

                    bank_name:
                        document.getElementById(
                            "bank_name"
                        ).value,

                    account_holder:
                        document.getElementById(
                            "account_holder"
                        ).value,

                    account_number:
                        document.getElementById(
                            "account_number"
                        ).value,

                    ifsc:
                        document.getElementById(
                            "ifsc"
                        ).value,

                    footer_note:
                        document.getElementById(
                            "footer_note"
                        ).value,

                    show_bank_details:
                        document.getElementById(
                            "show_bank_details"
                        ).checked,

                    show_footer_note:
                        document.getElementById(
                            "show_footer_note"
                        ).checked
                };

                await authFetch(
                    `${BASE_URL}/admin/settings`,
                    {

                        method: "PUT",

                        body: JSON.stringify(
                            payload
                        )
                    }
                );

                alert(
                    "Settings saved successfully!"
                );
            }

            async function deleteItem(id) {

                await authFetch(
                    `${BASE_URL}/admin/items/${id}`,
                    {
                        method: "DELETE"
                    }
                );

                loadItems();
            }

            // window.onload = () => {

            //     loadSettings();

            //     const role =
            //         localStorage.getItem("role");

            //     if (role !== "admin") {

            //         alert("Admin access required");

            //         window.location.href =
            //             "index.html";

            //         return;
            //     }

            //     loadUsers();

            //     loadItems();
            // }

            window.onload = async () => {

                const role =
                    localStorage.getItem("role");

                if (role !== "admin") {

                    alert("Admin access required");

                    window.location.href =
                        "index.html";

                    return;
                }

                showLoader();

                try {

                    await Promise.all([

                        loadSettings(),
                        loadUsers(),
                        loadItems()

                    ]);

                } catch (err) {

                    console.error(err);

                    alert(
                        "Failed to load admin panel"
                    );

                } finally {

                    hideLoader();
                }
            }

            function showLoader() {

                document.getElementById(
                    "pageLoader"
                ).style.display = "flex";
            }

            function hideLoader() {

                document.getElementById(
                    "pageLoader"
                ).style.display = "none";
            }

        </script>

</body>

</html>
