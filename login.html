<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>

        body {
            font-family: 'Segoe UI', Arial;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .login-box {
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            padding: 35px;
            border-radius: 18px;

            width: 320px;

            box-shadow: 0 10px 40px rgba(0,0,0,0.3);

            color: white;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;

            border: none;
            border-radius: 10px;

            outline: none;

            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 10px;

            background: #4CAF50;
            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            background: #45a049;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error {
            color: #ffb3b3;
            margin-top: 10px;
            text-align: center;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h2>Billing System Login</h2>

        <input
            id="username"
            placeholder="Username"
            autocomplete="username"
        >

        <input
            id="password"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
        >

        <button id="loginBtn" onclick="login()">
            Login
        </button>

        <div id="error" class="error"></div>

    </div>

<script>

const BASE_URL =
"https://billing-software-backend-04do.onrender.com";

// 🔥 Auto redirect if already logged in
if (localStorage.getItem("token")) {
    window.location.href = "index.html";
}

async function login() {

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const error =
        document.getElementById("error");

    const btn =
        document.getElementById("loginBtn");

    error.innerText = "";

    if (!username || !password) {
        error.innerText = "Enter username and password";
        return;
    }

    btn.disabled = true;
    btn.innerText = "Logging in...";

    try {

        const res = await fetch(`${BASE_URL}/login`, {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                username,
                password
            })

        });

        const data = await res.json();

        console.log(data);

        if (data.access_token) {

            localStorage.setItem(
                "token",
                data.access_token
            );

            window.location.href = "index.html";

        } else {

            error.innerText =
                data.detail || "Login failed";
        }

    } catch (err) {

        console.error(err);

        error.innerText =
            "Server connection failed";

    } finally {

        btn.disabled = false;
        btn.innerText = "Login";
    }
}

// 🔥 Enter key support
document.addEventListener("keydown", (e) => {

    if (e.key === "Enter") {
        login();
    }

});

</script>

</body>
</html>
