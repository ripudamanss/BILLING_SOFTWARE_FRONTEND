<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            background:
                url('https://images.pexels.com/photos/10387112/pexels-photo-10387112.jpeg') no-repeat center center/cover;
        }

        /* DARK OVERLAY */
        body::before {

            html,
            body {
                width: 100%;
                min-height: 100%;
            }

            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(2px);
        }

        /* LOGIN CARD */
        .login-container {
            position: absolute;
            width: 100%;
            max-width: 390px;
            padding: 38px 28px;
            border-radius: 24px;
            background:
                rgba(255, 255, 255, 0.12);
            border:
                1px solid rgba(255, 255, 255, 0.22);
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            color: white;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-container h1 {
            font-size: 38px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.82);
            margin-bottom: 30px;
            font-size: 14px;
        }

        /* INPUT GROUP */
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 48px 14px 16px;
            border-radius: 14px;
            border:
                1px solid rgba(255, 255, 255, 0.3);
            background:
                rgba(255, 255, 255, 0.08);
            color: white;
            outline: none;
            font-size: 15px;
            transition: 0.25s ease;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.65);
        }

        .input-group input:focus {
            border-color: #7CFFB2;
            background:
                rgba(255, 255, 255, 0.14);
            box-shadow:
                0 0 12px rgba(124, 255, 178, 0.3);
        }

        /* ICONS */
        .input-group span {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            opacity: 0.75;
        }

        /* REMEMBER */
        .remember-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 22px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.85);
        }

        /* LOGIN BUTTON */
        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background:
                linear-gradient(135deg,
                    #b6ff00,
                    #00c853);
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s ease;
            box-shadow:
                0 8px 20px rgba(0, 200, 83, 0.35);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow:
                0 10px 24px rgba(0, 200, 83, 0.42);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* FOOTER */
        .footer-text {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.72);
        }

        /* ERROR */
        .error-msg {
            margin-top: 18px;
            text-align: center;
            color: #ffb3b3;
            font-size: 14px;
            font-weight: 500;
        }

        /* LOADER */

        .loader {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* MOBILE */
        @media(max-width: 480px) {
            body {
                padding: 16px;
            }

            .login-container {
                padding: 34px 22px;
                border-radius: 20px;
            }

            .login-container h1 {
                font-size: 32px;
            }

            .subtitle {
                font-size: 13px;
            }

            .input-group input {
                padding: 13px 44px 13px 14px;
                font-size: 14px;
            }

            .login-btn {
                padding: 13px;
                font-size: 15px;
            }
        }
    </style>

</head>

<body>

    <div class="login-container">
        <h1>Login</h1>
        <p class="subtitle">
            Welcome back please login to your account
        </p>

        <!-- USERNAME -->
        <div class="input-group">
            <input type="text" id="username" placeholder="User Name">
            <span>👤</span>
        </div>

        <!-- PASSWORD -->
        <div class="input-group">
            <input type="password" id="password" placeholder="Password">
            <span>🔒</span>
        </div>

        <!-- REMEMBER -->
        <div class="remember-row">
            <input type="checkbox" checked>
            <label>
                Remember me
            </label>
        </div>

        <!-- LOGIN BUTTON -->
        <button class="login-btn" id="loginBtn" onclick="login()">
            Login
        </button>

        <!-- ERROR -->
        <div id="errorMsg" class="error-msg">
        </div>

        <!-- FOOTER -->
        <div class="footer-text">
            Billing Management System
        </div>

    </div>

    <script>
        const BASE_URL =
            "https://billing-software-backend-04do.onrender.com";

        async function login() {
            const username =
                document.getElementById(
                    "username"
                ).value;

            const password =
                document.getElementById(
                    "password"
                ).value;

            const btn =
                document.getElementById(
                    "loginBtn"
                );

            const error =
                document.getElementById(
                    "errorMsg"
                );

            error.innerText = "";
            // BUTTON LOADING
            btn.disabled = true;
            btn.innerHTML = `
            <div class="loader"></div>
            `;
            
            
            try {
                const res = await fetch(
                    `${BASE_URL}/login`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            username,
                            password
                        })
                    }
                );

                const data = await res.json();
                if (data.access_token) {
                    localStorage.setItem(
                        "token",
                        data.access_token
                    );
                    window.location.href =
                        "dashboard.html";
                } else {
                    error.innerText =
                        "Invalid username or password";
                }

            } catch (err) {
                console.error(err);
                error.innerText =
                    "Server connection failed";

            } finally {
                btn.disabled = false;
                btn.innerHTML = "Login";
            }
        }
    </script>

</body>

</html>
