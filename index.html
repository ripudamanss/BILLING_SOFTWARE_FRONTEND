<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing App</title>

    <style>
        body {
            font-family: 'Segoe UI', Arial;
            background: linear-gradient(180deg, #667eea, #764ba2);
            padding: 20px;
            margin: 0;
            color: #fff;
        }

        /* 🔥 Glass container */
        .glass {
            max-width: 1100px;
            margin: auto;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 25px;
            position: relative;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 18px;
            margin-bottom: 25px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        .field label {
            margin-bottom: 6px;
            font-weight: 600;
        }

        .field input {
            width: 100%;
            box-sizing: border-box;
        }


        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
        }

        label {
            font-weight: 500;
        }

        input,
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border-radius: 8px;
            border: none;
            outline: none;
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            transition: 0.2s;
            margin: 0;
        }

        input:focus,
        select:focus {
            background: white;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.2);
        }

        button {
            padding: 10px 14px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-weight: 500;
            backdrop-filter: blur(6px);
            transition: 0.2s;
            width: 100%;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: translateY(-1px);
        }

        .item-row {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .item-row input,
        .item-row select {
            flex: 1;
            min-width: 130px;
        }

        .item-row .price {
            max-width: 140px;
        }

        .item-row .qty {
            max-width: 120px;
        }

        .item-row .row-total {
            min-width: 90px;
            text-align: center;
        }

        .item-row button {
            background: rgba(255, 0, 0, 0.6);
        }

        .item-row button:hover {
            background: rgba(255, 0, 0, 0.8);
        }

        .unit-wrapper {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .row-total {
            font-weight: bold;
            min-width: 80px;
            color: #fff;
        }

        h3 {
            margin-top: 15px;
            font-weight: 600;
        }

        .top-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }

        .error {
            color: #ffb3b3;
            margin-top: 10px;
        }

        .loading-overlay {

            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            backdrop-filter: blur(4px);
        }

        .loading-box {
            background: rgba(255, 255, 255, 0.12);
            padding: 30px;
            border-radius: 18px;
            text-align: center;
            color: white;
            min-width: 240px;
        }

        .spinner {
            width: 55px;
            height: 55px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top: 5px solid white;
            border-radius: 50%;
            margin: auto auto 15px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Toast */
        #toastContainer {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .toast {
            min-width: 260px;
            max-width: 320px;
            padding: 14px 18px;
            border-radius: 12px;
            color: white;
            font-weight: 500;
            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.25);

            animation:
                slideIn 0.3s ease,
                fadeOut 0.3s ease 3.7s forwards;
            backdrop-filter: blur(10px);
        }

        .toast.success {

            background:
                linear-gradient(135deg,
                    #4CAF50,
                    #2E7D32);
        }

        .toast.error {
            background:
                linear-gradient(135deg,
                    #f44336,
                    #c62828);
        }

        .toast.info {
            background:
                linear-gradient(135deg,
                    #2196F3,
                    #1565C0);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform:
                    translateX(100%);
            }

            to {
                opacity: 1;
                transform:
                    translateX(0);
            }
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                transform:
                    translateX(100%);
            }
        }

        .logout-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #ff4d4d;
            width: auto;
        }

        .logout-btn:hover {
            background: #ff2d2d;
        }

        @media(max-width:768px) {

            body {
                padding: 10px;
            }

            .glass {
                padding: 18px;
            }

            h2 {
                font-size: 30px;
            }

            .item-row {
                flex-direction: column;
                align-items: stretch;
            }

            .top-actions {
                grid-template-columns: 1fr;
            }

            .logout-btn {
                position: static;
                margin-bottom: 10px;
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="glass">

        <h2>Create Bill</h2>
        <div class="form-grid">

            <div class="field">
                <label>Customer Name</label>

                <input type="text" id="customer" list="customerSuggestions" placeholder="Customer Name">
                <datalist id="customerSuggestions"></datalist>
            </div>
            <div class="field">
                <label>Address Line 1</label>
                <input type="text" id="customeradd1" placeholder="Address Line 1">
            </div>

            <div class="field">
                <label>Address Line 2</label>
                <input type="text" id="customeradd2" placeholder="Address Line 2">
            </div>

            <div class="field">
                <label>Date</label>
                <input type="date" id="date">
            </div>
        </div>

        <h3>Items</h3>
        <div id="items"></div>
        <datalist id="itemSuggestions"></datalist>

        <div class="top-actions">
            <button onclick="window.location.href='dashboard.html'">&#8592 Dashboard</button>
            <button onclick="clearForm()">Clear</button>
            <button onclick="addItem()">+ Add Item</button>
            <button onclick="window.location.href='history.html'">View Bills</button>
            <button id="submitBtn" onclick="submitBill()">Generate Bill</button>
            <!-- 🔥 Added ID for dynamic text change -->
            <button onclick="logout()" class="logout-btn">
                Logout
            </button>
        </div>

        <h3>Total: ₹ <span id="grandTotal">0.00</span></h3>
        <div id="downloadBox" style="margin-top:10px;"></div>
        <div id="error" class="error"></div>

    </div>

    <script>
        let customersData = [];
        async function loadCustomers() {
            const res = await authFetch( // added AuthFetch 12 may 2026 - instead of fetch
                `${BASE_URL}/customers`
            );
            customersData = await res.json();
            const datalist =
                document.getElementById(
                    "customerSuggestions"
                );
            datalist.innerHTML = "";
            customersData.forEach(customer => {
                datalist.innerHTML += `
            <option value="${customer.customer_name}">
        `;
            });
        }

        // Feature added 12 may 26
        checkSession();

        const BASE_URL = "https://billing-software-backend-04do.onrender.com"; //use /login for login endpoint
        // const BASE_URL = "https://supreme-space-spoon-qx9wr7g66ppfxvg7-10000.app.github.dev"; //use /login for login endpoint
        let editBillId = null;
        let itemsData = [];
        let isSubmitting = false;

        async function loadItems() {
            try {

                const res = await fetch(
                    `${BASE_URL}/items`,
                    {
                        headers: {
                            "Authorization":
                                "Bearer " +
                                localStorage.getItem("token")
                        }
                    }
                );

                itemsData = await res.json();

                const datalist =
                    document.getElementById(
                        "itemSuggestions"
                    );

                datalist.innerHTML = "";

                itemsData.forEach(item => {

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        item.description;

                    datalist.appendChild(option);
                });

            } catch (err) {

                console.error(
                    "Items load error:",
                    err
                );
            }
        }

        // Feature added 12 may 26
        // 🔥 SESSION CHECK
        function checkSession() {

            const token =
                localStorage.getItem("token");

            const expiry =
                localStorage.getItem("token_expiry");

            // No token
            if (!token || !expiry) {

                logoutUser();
                return;
            }

            // Expired
            if (Date.now() > parseInt(expiry)) {

                alert(
                    "Session expired. Please login again."
                );

                logoutUser();
            }
        }

        // 🔥 CENTRAL LOGOUT
        function logoutUser() {

            localStorage.removeItem("token");
            localStorage.removeItem("role");

            localStorage.removeItem(
                "token_expiry"
            );

            localStorage.removeItem(
                "editBillId"
            );

            window.location.href =
                "login.html";
        }

        // Feature added 12 may 26
        // 🔥 AUTH FETCH WRAPPER
        async function authFetch(
            url,
            options = {}
        ) {

            const token =
                localStorage.getItem("token");

            options.headers = {
                ...(options.headers || {}),
                "Authorization":
                    "Bearer " + token
            };

            const res =
                await fetch(url, options);

            // 🔥 SESSION EXPIRED
            if (res.status === 401) {

                alert(
                    "Session expired. Login again."
                );

                logoutUser();

                throw new Error("Unauthorized");
            }

            return res;
        }

        function addItem(itemData = null) {
            const div = document.createElement("div");
            div.className = "item-row";

            div.innerHTML = `
        <input placeholder="Description" class="desc" list="itemSuggestions" autocomplete="off" value="${itemData?.description || ""}">
        <input placeholder="Note" class="note" value="${itemData?.note || ""}">
        <input type="number" step="any" placeholder="Qty" class="qty" value="${itemData?.qty || ""}">

        <div class="unit-wrapper">
            <select class="unit-select" onchange="handleUnitChange(this)">
                <option value="">Unit</option>
                <option value="Truck">Truck</option>
                <option value="Sqft">Sqft</option>
                <option value="Hr">Hr</option>
                <option value="Kg">Kg</option>
                <option value="Nos">Nos</option>
                <option value="custom">Other...</option>
            </select>

            <input placeholder="Custom Unit" class="unit-input" style="display:none;">
            <input type="hidden" class="unit" value="${itemData?.unit || ""}">
        </div>

        <input type="number" step="any" placeholder="Price" class="price" value="${itemData?.price || ""}">
        <span class="row-total">₹ 0</span>

        <button onclick="this.parentElement.remove(); calculateTotals();">❌</button>
    `;

            document.getElementById("items").appendChild(div);
            const descInput =
                div.querySelector(".desc");

            const priceInput =
                div.querySelector(".price");

            const hiddenUnit =
                div.querySelector(".unit");

            const unitSelect =
                div.querySelector(".unit-select");

            const customUnit =
                div.querySelector(".unit-input");

            descInput.addEventListener(
                "change",
                () => {

                    const matchedItem =
                        itemsData.find(
                            item =>
                                item.description
                                    .toLowerCase()
                                    .trim()
                                ===
                                descInput.value
                                    .toLowerCase()
                                    .trim()
                        );

                    if (!matchedItem) return;

                    // AUTO PRICE
                    priceInput.value =
                        matchedItem.price;

                    // AUTO UNIT
                    const standardUnits = [
                        "Truck",
                        "Sqft",
                        "Hr",
                        "Kg",
                        "Nos",
                        "Hour"
                    ];

                    if (
                        standardUnits.includes(
                            matchedItem.unit
                        )
                    ) {

                        unitSelect.value =
                            matchedItem.unit;

                        hiddenUnit.value =
                            matchedItem.unit;

                        customUnit.style.display =
                            "none";

                    } else {

                        unitSelect.value =
                            "custom";

                        customUnit.style.display =
                            "inline-block";

                        customUnit.value =
                            matchedItem.unit;

                        hiddenUnit.value =
                            matchedItem.unit;
                    }

                    calculateTotals();
                }
            );

            div.querySelectorAll(".qty, .price").forEach(input => {
                input.addEventListener("input", calculateTotals);
            });

            if (itemData?.unit) {
                const wrapper = div.querySelector(".unit-wrapper");
                const select = wrapper.querySelector(".unit-select");
                const input = wrapper.querySelector(".unit-input");
                const hidden = wrapper.querySelector(".unit");

                const options = ["Truck", "Sqft", "Hr", "Kg", "Nos"];

                if (options.includes(itemData.unit)) {
                    select.value = itemData.unit;
                    hidden.value = itemData.unit;
                } else {
                    select.value = "custom";
                    input.style.display = "inline-block";
                    input.value = itemData.unit;
                    hidden.value = itemData.unit;
                }
            }

            setTimeout(() => calculateTotals(), 0);
        }

        function handleUnitChange(select) {
            const wrapper = select.parentElement;
            const input = wrapper.querySelector(".unit-input");
            const hidden = wrapper.querySelector(".unit");

            if (select.value === "custom") {
                input.style.display = "inline-block";
                input.focus();
                hidden.value = "";
            } else {
                input.style.display = "none";
                hidden.value = select.value;
            }

            input.oninput = () => hidden.value = input.value;
        }

        function calculateTotals() {
            let total = 0;

            document.querySelectorAll(".item-row").forEach(row => {
                const qty = parseFloat(row.querySelector(".qty").value) || 0;
                const price = parseFloat(row.querySelector(".price").value) || 0;

                const rowTotal = qty * price;
                row.querySelector(".row-total").innerText = "₹ " + rowTotal.toFixed(2);

                total += rowTotal;
            });

            document.getElementById("grandTotal").innerText = total.toFixed(2);
        }

        async function loadBill(id) {
            const res = await authFetch(`${BASE_URL}/bills/${id}`, {  // Added 12 may 26 only authFetch instead of fetch
                headers: {
                    "Authorization": "Bearer " + localStorage.getItem("token")
                }
            });
            const data = await res.json();
            console.log("UPDATE RESPONSE:", data);
            // New added console log to check response structure
            if (!res.ok) {
                showError(data.detail || "Update failed");
                return;
            }

            editBillId = id;
            console.log("Editing bill:", id);
            // 🔥 Set button text to indicate update mode
            document.getElementById("submitBtn").innerText = "Update Bill";
            document.getElementById("customer").value = data.bill.customer;
            document.getElementById("customeradd1").value = data.bill.customeradd1 || "";
            document.getElementById("customeradd2").value = data.bill.customeradd2 || "";
            document.getElementById("date").value = data.bill.date?.split("T")[0] || "";

            document.getElementById("items").innerHTML = "";
            data.items.forEach(item => addItem(item));

            setTimeout(() => calculateTotals(), 100);
        }


        async function submitBill() {

            if (isSubmitting) return;

            isSubmitting = true;

            showLoading(
                editBillId
                    ? "Updating Bill..."
                    : "Generating Bill..."
            );

            try {

                document.getElementById("error").innerText = "";

                const customer =
                    document.getElementById("customer")
                        .value.trim();

                const customeradd1 =
                    document.getElementById("customeradd1")
                        .value;

                const customeradd2 =
                    document.getElementById("customeradd2")
                        .value;

                const date =
                    document.getElementById("date")
                        .value;

                // 🔥 Validation

                if (!customer || !date) {

                    showError(
                        "Customer and date required"
                    );

                    return;
                }

                let items = [];

                for (let row of document.querySelectorAll(".item-row")) {

                    const desc =
                        row.querySelector(".desc")
                            .value.trim();

                    const qty =
                        parseFloat(
                            row.querySelector(".qty").value
                        );

                    const price =
                        parseFloat(
                            row.querySelector(".price").value
                        );

                    const unit =
                        row.querySelector(".unit")
                            .value.trim();

                    if (
                        !desc ||
                        isNaN(qty) ||
                        isNaN(price) ||
                        !unit
                    ) {

                        showError(
                            "Fill all item fields correctly"
                        );

                        return;
                    }

                    items.push({
                        description: desc,
                        note: row.querySelector(".note").value,
                        qty,
                        unit,
                        price
                    });
                }

                // 🔥 API URL

                const url = editBillId
                    ? `${BASE_URL}/bills/${editBillId}`
                    : `${BASE_URL}/bills`;

                const method =
                    editBillId ? "PUT" : "POST";

                // 🔥 Save Bill

                const res = await authFetch(url, { // Added 12 may 26 authFetch in fetch first 

                    method,

                    headers: {
                        "Content-Type": "application/json",
                        "x-api-key": "mysecretkey123",
                        "Authorization":
                            "Bearer " +
                            localStorage.getItem("token")
                    },

                    body: JSON.stringify({
                        customer,
                        customeradd1,
                        customeradd2,
                        date,
                        items
                    })
                });

                const data = await res.json();

                console.log("BILL RESPONSE:", data);

                if (!res.ok) {

                    showError(
                        data.detail ||
                        "Bill save failed"
                    );

                    return;
                }

                const idToUse =
                    editBillId || data.id;

                // 🔥 Generate PDF

                const finalRes = await fetch(
                    `${BASE_URL}/bills/${idToUse}/pdf`,
                    {
                        headers: {
                            "Authorization":
                                "Bearer " +
                                localStorage.getItem("token")
                        }
                    }
                );

                const finalData =
                    await finalRes.json();

                console.log(
                    "PDF RESPONSE:",
                    finalData
                );

                if (!finalRes.ok) {

                    showError(
                        finalData.detail ||
                        "PDF generation failed"
                    );

                    return;
                }

                // 🔥 Open PDF

                window.open(
                    finalData.pdf_url,
                    "_blank"
                );

                // 🔥 Success Message

                showSuccess(
                    editBillId
                        ? "Bill updated successfully!"
                        : "Bill generated successfully!"
                );

                // 🔥 Download Button

                const downloadDiv =
                    document.getElementById(
                        "downloadBox"
                    );

                downloadDiv.innerHTML = `
            <a href="${finalData.pdf_url}" download>
                <button style="background:#4CAF50;">
                    Download PDF
                </button>
            </a>
        `;

                // 🔥 Reset edit mode

                editBillId = null;

                localStorage.removeItem(
                    "editBillId"
                );

                document.getElementById(
                    "submitBtn"
                ).innerText = "Generate Bill";

            } catch (err) {

                console.error(err);

                showError(
                    "Server connection failed"
                );

            } finally {

                // 🔥 ALWAYS runs

                hideLoading();
                function showToast(message, type = "success") {

                    const container =
                        document.getElementById(
                            "toastContainer"
                        );

                    const toast =
                        document.createElement("div");

                    toast.className =
                        `toast ${type}`;

                    // Icons

                    let icon = "ℹ️";

                    if (type === "success") {
                        icon = "✅";
                    }

                    if (type === "error") {
                        icon = "❌";
                    }

                    toast.innerHTML = `
        <span>${icon}</span>
        <span style="margin-left:8px;">
            ${message}
        </span>
    `;

                    container.appendChild(toast);

                    // Remove after animation

                    setTimeout(() => {

                        toast.remove();

                    }, 4000);
                }

                isSubmitting = false;
            }
        }

        function showError(msg) {
            // document.getElementById("error").innerText = msg;
            const el = document.getElementById("error");

            el.style.color = "#ffb3b3";
            el.style.fontWeight = "bold";
            el.style.marginTop = "10px";

            el.innerText = msg;
        }

        function showSuccess(msg) {
            const el = document.getElementById("error");
            el.style.color = "#b6ffb6";
            el.style.fontWeight = "bold";
            el.style.marginTop = "10px";

            el.innerText = msg;

            setTimeout(() => {
                el.innerText = "";
            }, 3000);
        }

        window.onload = async () => {

            loadCustomers();

            document.getElementById("customer")
                .addEventListener("input", function () {
                    const selectedCustomer =
                        customersData.find(
                            customer =>
                                customer.customer_name
                                    .toLowerCase() ===
                                this.value.toLowerCase()
                        );
                    if (selectedCustomer) {
                        document.getElementById(
                            "customeradd1"
                        ).value =
                            selectedCustomer.address1 || "";
                        document.getElementById(
                            "customeradd2"
                        ).value =
                            selectedCustomer.address2 || "";
                    }
                });

            await loadItems();
            const id =
                localStorage.getItem("editBillId");
            if (id) {
                loadBill(id);
            } else {
                addItem();
            }
        };

        // function logout() {
        //     localStorage.removeItem("token");
        //     window.location.href = "login.html";
        // }

        // added 12 may 2026
        function logout() {
            logoutUser();
        }

        function clearForm() {

            document.getElementById("customer").value = "";
            document.getElementById("customeradd1").value = "";
            document.getElementById("customeradd2").value = "";
            document.getElementById("date").value = "";

            document.getElementById("items").innerHTML = "";

            addItem();

            calculateTotals();

            document.getElementById("downloadBox").innerHTML = "";

            document.getElementById("error").innerText = "";

            // 🔥 Clear edit mode
            editBillId = null;

            localStorage.removeItem("editBillId");

            // 🔥 Reset button text
            document.getElementById("submitBtn").innerText = "Generate Bill";

        }

        function showLoading(text = "Processing...") {

            document.getElementById("loadingOverlay")
                .style.display = "flex";

            document.getElementById("loadingText")
                .innerText = text;

            document.getElementById("submitBtn")
                .disabled = true;
        }

        function hideLoading() {

            document.getElementById("loadingOverlay")
                .style.display = "none";

            document.getElementById("submitBtn")
                .disabled = false;
        }

    </script>
    <div id="loadingOverlay" class="loading-overlay">

        <div class="loading-box">

            <div class="spinner"></div>

            <p id="loadingText">
                Generating Bill...
            </p>

        </div>

    </div>

    <div id="toastContainer"></div>
</body>

</html>
