<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill History</title>

    <style>
        body {
            font-family: 'Segoe UI', Arial;
            background: #f5f7fb;
            padding: 20px;
            max-width: 900px;
            margin: auto;
        }

        h2 {
            text-align: center;
            background: white;
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        th {
            background: #4CAF50;
            color: white;
            padding: 10px;
            text-align: center;
        }

        td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #f9f9f9;
        }

        button {
            padding: 6px 10px;
            margin: 2px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }

        .pdf-btn {
            background: #2196F3;
            color: white;
        }

        .pdf-btn:hover {
            background: #1976D2;
        }

        .edit-btn {
            background: #FFC107;
        }

        .edit-btn:hover {
            background: #e0a800;
        }

        .delete-btn {
            background: #f44336;
            color: white;
        }

        .delete-btn:hover {
            background: #d32f2f;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }

        .top-bar button {
            background: #4CAF50;
            color: white;
        }

        .top-bar button:hover {
            background: #45a049;
        }

        .empty {
            text-align: center;
            margin-top: 20px;
            color: #777;
        }

        .loading-box {
            text-align: center;
            margin-top: 30px;
            color: #555;
            transition: 0.3s;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #ddd;
            border-top: 5px solid #4CAF50;
            border-radius: 50%;
            margin: auto auto 15px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .search-box {
            margin-top: 20px;
            margin-bottom: 10px;
        }

        .search-box input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ddd;
            outline: none;
            font-size: 15px;
            box-sizing: border-box;
            transition: 0.2s;
        }

        .search-box input:focus {
            border-color: #4CAF50;
            box-shadow: 0 0 8px rgba(76, 175, 80, 0.25);
        }

        #searchEmptyMsg {
            font-size: 16px;
            font-weight: 500;
            margin-top: 20px;
            color: #888;
        }

        /* Skeleton CSS */
        #skeletonLoader {
            margin-top: 20px;
        }

        .skeleton-row {
            height: 78px;
            border-radius: 14px;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
            background:
                linear-gradient(90deg,
                    #cfcfcf 25%,
                    #e8e8e8 50%,
                    #cfcfcf 75%);

            background-size: 400% 100%;
            animation:
                shimmer 1.2s infinite;
            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.08);
        }

        @keyframes shimmer {
            0% {
                background-position:
                    100% 0;
            }

            100% {
                background-position:
                    -100% 0;
            }
        }
    </style>
</head>

<body>

    <h2>All Bills</h2>
    <!-- Skeleton Loading -->
    <div id="skeletonLoader">

        <div class="skeleton-row"></div>
        <div class="skeleton-row"></div>
        <div class="skeleton-row"></div>
        <div class="skeleton-row"></div>
        <div class="skeleton-row"></div>

    </div>

    <div class="search-box">

        <input type="text" id="searchInput" placeholder="Search customer..." onkeyup="filterBills()">

    </div>

    <div class="top-bar">

        <button onclick="window.location.href='dashboard.html'">
            &#8592 Dashboard
        </button>

        <button onclick="window.location.href='index.html'">+ Create New Bill</button>
    </div>

    <table id="table" style="display: none;">
        <tr>
            <th>BILL NO</th>
            <th>Customer</th>
            <th>Total (₹)</th>
            <th>Actions</th>
        </tr>
    </table>

    <div id="emptyMsg" class="empty"></div>
    <div id="searchEmptyMsg" class="empty" style="display:none;">

        No matching bills found

    </div>

    <script>
        //  added 12 may 2026 - 
        checkSession();

        const BASE_URL = "https://billing-software-backend-04do.onrender.com";
        // const BASE_URL = "https://supreme-space-spoon-qx9wr7g66ppfxvg7-10000.app.github.dev";
        
        // Added 12 may 2026
        // 🔥 SESSION CHECK
        function checkSession() {

            const token =
                localStorage.getItem("token");

            const expiry =
                localStorage.getItem("token_expiry");

            // No token
            if (!token || !expiry) {

                logoutUser();
                return;
            }

            // Expired
            if (Date.now() > parseInt(expiry)) {

                alert(
                    "Session expired. Please login again."
                );

                logoutUser();
            }
        }

        // 🔥 CENTRAL LOGOUT
        function logoutUser() {

            localStorage.removeItem("token");
            localStorage.removeItem("role");
            localStorage.removeItem(
                "token_expiry"
            );

            localStorage.removeItem(
                "editBillId"
            );

            window.location.href =
                "login.html";
        }

        // Feature added 12 may 26
        // 🔥 AUTH FETCH WRAPPER
        async function authFetch(
            url,
            options = {}
        ) {

            const token =
                localStorage.getItem("token");

            options.headers = {
                ...(options.headers || {}),
                "Authorization":
                    "Bearer " + token
            };

            const res =
                await fetch(url, options);

            // 🔥 SESSION EXPIRED
            if (res.status === 401) {

                alert(
                    "Session expired. Login again."
                );

                logoutUser();

                throw new Error("Unauthorized");
            }

            return res;
        }

        async function loadBills() {
            const skeletonLoader = document.getElementById("skeletonLoader");
            const table =
                document.getElementById("table");
            const emptyMsg =
                document.getElementById("emptyMsg");

            // 🔥 Start loading state
            table.style.display = "none";
            emptyMsg.innerText = "";

            try {
                const res = await authFetch( // 12 may 26 added authFetch instead of fetch
                    `${BASE_URL}/bills`,
                    {
                        headers: {
                            "Authorization":
                                "Bearer " +
                                localStorage.getItem("token")
                        }
                    }
                );

                const data = await res.json();
                console.log("BILLS RESPONSE:", data);

                // 🔥 Handle backend failure

                if (!res.ok) {
                    loadingBox.innerHTML = `
                <p style="color:red; font-weight:bold;">
                    Failed to load bills
                </p>
            `;

                    return;
                }
                // 🔥 Reset table

                table.innerHTML = `
            <tr>
                <th>ID</th>
                <th>Customer</th>
                <th>Total (₹)</th>
                <th>Actions</th>
            </tr>
        `;

                // 🔥 Empty database case

                if (data.length === 0) {
                    // loadingBox.style.display = "none";
                    skeletonLoader.style.display = "none";
                    emptyMsg.innerText =
                        "No bills found";
                    return;
                }

                // 🔥 Show table only after data arrives
                // loadingBox.style.display = "none";
                skeletonLoader.style.display = "none";
                table.style.display = "table";

                // 🔥 Insert rows
                data.forEach(bill => {
                    const row = table.insertRow();
                    row.innerHTML = `
                <td>${bill.id}</td>
                <td>${bill.customer}</td>
                <td>
                    ${bill.total
                            ? bill.total.toFixed(2)
                            : "0.00"}
                </td>
                <td>
                    <button
                        class="pdf-btn"
                        onclick="viewPDF(${bill.id})">
                        View
                    </button>

                    <button
                        class="pdf-btn"
                        onclick="downloadPDF(${bill.id})">
                        Download
                    </button>
                    <button
                        class="edit-btn"
                        onclick="editBill(${bill.id})">
                        Edit
                    </button>

                    <button
                        class="delete-btn"
                        onclick="deleteBill(${bill.id})">
                        Delete
                    </button>
                </td>
            `;
                });

            } catch (err) {
                console.error(err);
                skeletonLoader.innerHTML = `
                <p style="
                    color:red;
                    text-align:center;
                    font-weight:bold;
                ">
                    Server connection failed
                </p>
            `;
            }
        }

        // filterbill
        function filterBills() {

            const input =
                document.getElementById("searchInput");

            const filter =
                input.value.toLowerCase();

            const table =
                document.getElementById("table");

            const rows =
                table.getElementsByTagName("tr");

            const searchEmptyMsg =
                document.getElementById(
                    "searchEmptyMsg"
                );

            let visibleCount = 0;

            // Skip header row

            for (let i = 1; i < rows.length; i++) {

                const customerCell =
                    rows[i].cells[1];

                if (!customerCell) continue;

                const customerText =
                    customerCell.textContent
                    || customerCell.innerText;

                if (
                    customerText
                        .toLowerCase()
                        .includes(filter)
                ) {

                    rows[i].style.display = "";

                    visibleCount++;

                } else {

                    rows[i].style.display = "none";
                }
            }

            // 🔥 No results handling

            if (visibleCount === 0) {

                searchEmptyMsg.style.display = "block";

            } else {

                searchEmptyMsg.style.display = "none";
            }
        }

        function createActionLoader() {
            if (document.getElementById("actionLoader")) {
                return document.getElementById("actionLoader");
            }

            const loader = document.createElement("div");
            loader.id = "actionLoader";
            loader.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,0.92);z-index:9999;";
            loader.innerHTML = `
                <div style="text-align:center; padding:20px; border-radius:12px; background:#fff; box-shadow:0 2px 15px rgba(0,0,0,0.15);">
                    <div style="width:48px; height:48px; border:5px solid #ddd; border-top-color:#4CAF50; border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 15px;"></div>
                    <div id="loaderText" style="font-size:16px; color:#333;">Loading...</div>
                </div>
            `;
            document.body.appendChild(loader);
            return loader;
        }

        function showActionLoader(message) {
            const loader = createActionLoader();
            const textEl = loader.querySelector("#loaderText");
            if (textEl) {
                textEl.innerText = message;
            }
            loader.style.display = "flex";
        }

        function hideActionLoader() {
            const loader = document.getElementById("actionLoader");
            if (loader) {
                loader.style.display = "none";
            }
        }

        async function viewPDF(id) {
            try {
                showActionLoader("Opening PDF...");
                const res = await authFetch(`${BASE_URL}/bills/${id}/pdf`, { // 12 may 26 added authFetch instead of fetch
                    headers: {
                        "Authorization": "Bearer " + localStorage.getItem("token")
                    }
                });

                const data = await res.json();

                window.open(data.pdf_url, "_blank");
            } catch (err) {
                console.error(err);
                alert("Unable to open PDF. Please try again.");
            } finally {
                hideActionLoader();
            }
        }
                

        // 🔥 ADDED: download function
        async function downloadPDF(id) {
            const res = await authFetch(`${BASE_URL}/bills/${id}/pdf`, { // 12 may 26 added authFetch instead of fetch
                headers: {
                    "Authorization": "Bearer " + localStorage.getItem("token")
                }
            });

            const data = await res.json();

            const link = document.createElement("a");
            link.href = data.pdf_url;
            link.download = `bill_${id}.pdf`;
            document.body.appendChild(link);
            link.click();
            link.remove();
        }

        function editBill(id) {
            localStorage.setItem("editBillId", id);
            localStorage.setItem("showEditLoading", "true");
            showActionLoader("Opening editor...");
            setTimeout(() => {
                window.location.href = "./index.html";
            }, 80);
        }


        async function deleteBill(id) {
            if (!confirm("Delete this bill?")) return;

            await authFetch(`${BASE_URL}/bills/${id}`, { // 12 may 26 added authFetch instead of fetch
                method: "DELETE",
                headers: {
                    "Authorization": "Bearer " + localStorage.getItem("token")
                }
            });

            // 🔥 ADDED: smooth reload
            loadBills();
        }

        loadBills();
    </script>

</body>

</html>
